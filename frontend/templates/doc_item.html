<div class="flex items-center gap-3 border-2 rounded-2xl px-4 py-3 animate-fade-in shadow-sm transition-all hover:shadow-md"
     style="background-color: #ffffff; border-color: #CCE3DE;">
    
    <!-- File Icon Container: Sage BG #EAF4F4 -->
    <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border"
         style="background-color: #EAF4F4; border-color: #CCE3DE;">
        <svg class="w-5 h-5" style="color: #6B9080;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
    </div>

    <!-- Document Name: Deep Charcoal #1D2B24 -->
    <span class="text-sm font-black truncate flex-1 uppercase tracking-tight" 
          style="color: #1D2B24;">
        {{ doc }}
    </span>

    <!-- Success Check: Deep Sage #6B9080 -->
    <div class="bg-[#F6FFF8] p-1 rounded-full border border-[#CCE3DE]">
        <svg class="w-4 h-4 shrink-0" style="color: #6B9080;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
    </div>
</div>
