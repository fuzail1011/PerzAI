<div class="msg-assistant flex gap-3 animate-fade-in">
    <!-- Assistant Avatar: Deep Sage #6B9080 -->
    <div class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center text-white font-black text-sm shadow-sm"
         style="background-color: #6B9080;">
        {{ initial }}
    </div>
    
    <!-- Message Bubble: Ice Mint #EAF4F4 with Soft Mint Border #CCE3DE -->
    <div class="bubble rounded-2xl rounded-tl-sm px-5 py-3.5 max-w-2xl border-2 shadow-sm"
         style="background-color: #EAF4F4; border-color: #CCE3DE;">
        <!-- Text: Deep Charcoal Green #1D2B24 -->
        <p class="text-sm font-bold whitespace-pre-wrap leading-relaxed" 
           style="color: #1D2B24;">{{ response }}</p>
    </div>
</div>
