<div class="persona-card bg-white border-2 rounded-[2rem] p-6 flex flex-col gap-4 shadow-sm hover:shadow-xl hover:shadow-[#1D2B24]/5 transition-all duration-300 animate-fade-in group"
     id="persona-{{ persona.id }}"
     style="border-color: #CCE3DE;">
    
    <!-- Top Row: Avatar & Actions -->
    <div class="flex items-start justify-between">
        <div class="flex items-center gap-4">
            <!-- Avatar: Deep Sage #6B9080 -->
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-black text-lg shadow-lg shadow-[#6B9080]/20 shrink-0"
                 style="background-color: #6B9080;">
                {{ persona.name[0].upper() }}
            </div>
            <div>
                <!-- Title: Deep Charcoal #1D2B24 -->
                <h3 class="font-black text-sm uppercase tracking-tight leading-tight" 
                    style="color: #1D2B24;">
                    {{ persona.name }}
                </h3>
                <!-- Date: Muted Sage #A4C3B2 -->
                <p class="text-[10px] font-bold uppercase tracking-widest mt-1" 
                   style="color: #A4C3B2;">
                    {{ persona.created_at.strftime('%b %d, %Y') }}
                </p>
            </div>
        </div>

        <!-- Delete Action -->
        <button hx-delete="/ui/personas/{{ persona.id }}"
                hx-target="#persona-{{ persona.id }}"
                hx-swap="outerHTML swap:0.2s"
                hx-confirm="Delete '{{ persona.name }}'? This will also remove all its knowledge base data."
                class="opacity-0 group-hover:opacity-100 p-2 rounded-xl text-gray-400 hover:text-red-600 hover:bg-red-50 transition-all duration-200">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
    </div>

    <!-- Description: Deep Charcoal but slightly lighter font weight -->
    {% if persona.description %}
    <p class="text-xs font-bold leading-relaxed line-clamp-2" 
       style="color: #6B9080;">
        {{ persona.description }}
    </p>
    {% else %}
    <p class="text-xs font-bold italic opacity-40" style="color: #6B9080;">
        No description provided.
    </p>
    {% endif %}

    <!-- Primary Action: Deep Charcoal BG #1D2B24 with White Text -->
    <a href="/ui/persona/{{ persona.id }}"
       class="mt-auto flex items-center justify-center gap-2 py-3.5 rounded-2xl text-white text-xs font-black uppercase tracking-widest transition-all shadow-lg active:scale-95 shadow-[#1D2B24]/10"
       style="background-color: #1D2B24;">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        Open Persona
    </a>
</div>
